name: CI + SonarCloud

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-sonar:
    name: Build, Test, Analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: write
      # Required for SonarCloud SARIF upload
      security-events: write

    steps:
      # -------------------------
      # Checkout code
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Sonar needs full history

      # -------------------------
      # Python setup
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # -------------------------
      # Run tests + collect coverage
      # -------------------------
      - name: Run tests
        run: |
          pytest --cov --cov-report=xml --cov-report=term
        env:
          DJANGO_SETTINGS_MODULE: config.settings_ci

      # -------------------------
      # Upload coverage as artifact
      # -------------------------
      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.xml

      # -------------------------
      # Docstring coverage and consistency
      # -------------------------
      - name: Install doc-check tools
        run: pip install interrogate pydoclint

      - name: Docstring coverage report
        run: interrogate -v familyhistory/
        continue-on-error: true # so won't fail the action

      - name: Docstring/signature consistency report
        run: pydoclint familyhistory/
        continue-on-error: true # so won't fail the action

      # -------------------------
      # SonarQube Cloud scan
      # -------------------------
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}