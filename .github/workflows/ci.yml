name: CI + SonarCloud

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-sonar:
    name: Build, Test, Analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: write
      # Required for SonarCloud SARIF upload
      security-events: write

    steps:
      # -------------------------
      # Checkout code
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # Sonar needs full history

      # -------------------------
      # Python setup via uv
      # -------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --locked

      # -------------------------
      # Run tests + collect coverage
      # -------------------------
      - name: Run tests
        run: uv run pytest --cov --cov-report=xml --cov-report=term
        env:
          DJANGO_SETTINGS_MODULE: config.settings_ci

      # -------------------------
      # Upload coverage as artifact
      # -------------------------
      - name: Upload coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage.xml

      # -------------------------
      # Docstring coverage and consistency
      # -------------------------
      - name: Docstring coverage report
        run: uv run interrogate -v familyhistory/
        continue-on-error: true # so won't fail the action

      - name: Docstring/signature consistency report
        run: uv run pydoclint familyhistory/
        continue-on-error: true # so won't fail the action

      # -------------------------
      # SonarQube Cloud scan
      # -------------------------
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}