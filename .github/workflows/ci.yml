name: CI + SonarCloud

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-test-sonar:
    name: Build, Test, Analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: write
      # Required for SonarCloud SARIF upload
      security-events: write

    steps:
      # -------------------------
      # Checkout code
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Sonar needs full history

      # -------------------------
      # Python setup
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov coverage

      # -------------------------
      # Run tests + collect coverage
      # -------------------------
      - name: Run tests
        run: |
          pytest --cov=xailens --cov-report=xml --cov-report=term

      # -------------------------
      # Upload coverage as artifact
      # -------------------------
      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.xml

      # -------------------------
      # Docstring coverage and consistency
      # -------------------------
      #- name: Install doc-check tools
      #  run: pip install interrogate pydoclint

      #- name: Docstring coverage report
      #  run: interrogate -v xailens/
      #  continue-on-error: true # so won't fail the action

      #- name: Docstring/signature consistency report
      #  run: pydoclint xailens/
      #  continue-on-error: true # so won't fail the action

      # -------------------------
      # SonarQube Cloud scan
      # -------------------------
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}