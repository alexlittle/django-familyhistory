name: CI + SonarCloud

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]



jobs:
  build-test-sonar:
    name: Build, Test, Analyze
    runs-on: ubuntu-26.04
    env:
      UV_NO_SYNC: "1"
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: write
      # Required for SonarCloud SARIF upload
      security-events: write

    # -------------------------
    # MySQL service container
    # -------------------------
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root
          -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      # -------------------------
      # Checkout code
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Sonar needs full history

      # -------------------------
      # Python setup via uv
      # -------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-default-groups --group dev --locked

      # -------------------------
      # Run tests + collect coverage
      # -------------------------
      - name: Run tests
        run: uv run --frozen --no-build pytest --cov --cov-report=xml --cov-report=term
        env:
          DJANGO_SETTINGS_MODULE: config.ci
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}

      # -------------------------
      # Upload coverage as artifact
      # -------------------------
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

      # -------------------------
      # Docstring coverage and consistency
      # -------------------------
      - name: Docstring coverage report
        run: uv run --frozen --no-build interrogate -v familyhistory/
        continue-on-error: true # so won't fail the action

      - name: Docstring/signature consistency report
        run: uv run --frozen --no-build pydoclint familyhistory/
        continue-on-error: true # so won't fail the action

      # -------------------------
      # SonarQube Cloud scan
      # -------------------------

      - name: Get version
        id: ver
        run: |
          echo "v=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.projectVersion=${{ steps.ver.outputs.v }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}