{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block content %}
<h2>Add Relationship for {{ person.get_display_name }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    {% include 'fh/includes/person-search-widget.html' with target_input_id='id_related_person' %}

    <button type="submit">Save</button>
</form>

<script src="{% static 'familyhistory/person-search-widget.js' %}" defer></script>
{% endblock %}
